# fue auto-importado por SonarCloud con key <github-user>_<repo>, no el key legacy.
sonar.projectKey=felipemiramontesr_mantenimiento_piic
sonar.organization=client-auth-token-prod-environment-secure-storage-key-alpha-bravo-charlie-delta-echo-foxtrot-golf-hotel-india-juliett-kilo-lima-mike-november-oscar-papa-quebec-romeo-sierra-tango-uniform-victor-whiskey-xray-yankee-zulu-0123456789-endpoint-validation-v1
sonar.projectName=Mantenimiento PIIC - Archon
sonar.projectVersion=78.101

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
# FC 069 F3 — Sonar certifica solo superficie real de produccion:
# src/scripts/ (seeds CLI vivos, fuera de superficie Sonar) y db/scripts (tooling
# packages/database/scripts/ (runners historicos) quedan fuera (acordado con GrayMan).
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.js,**/*.config.ts,apps/api/src/scripts/**,packages/database/scripts/**

# FC162 R3-B1 (Cond.R-162-R3, 201_AN) — sonar.exclusions arriba saca archivos
# del analisis por completo; esta propiedad es distinta: mantiene el archivo
# analizado (code smells/bugs) pero lo saca del DENOMINADOR de cobertura.
# Solo N/A demostrado (tipado puro / infraestructura de test / build config):
# vite-env.d.ts + types/** (sin logica ejecutable), src/test/** (handlers MSW,
# setup, polyfills, globalTeardown — infraestructura, no runtime), *.config.js
# y dist/** (build artifacts, ya en sonar.exclusions arriba, redundancia
# intencional a nivel de cobertura).
sonar.coverage.exclusions=**/vite-env.d.ts,**/types/**,**/src/test/**,**/*.config.js,**/dist/**

# FC162 F1-T3: packages/contracts no tenía config de test/coverage propia -- su
# codigo se ejecuta via alias en apps/api pero v8 nunca atribuia lineas de
# vuelta a packages/contracts/src/index.ts en NINGUN lcov (confirmado: 0
# ocurrencias de "contracts" en apps/api/coverage/lcov.info antes de este FC).
# Ahora tiene su propio vitest.config.ts + suite (packages/contracts/src/index.test.ts).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/contracts/coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Forensic Complexity Thresholds
sonar.cpd.ts.minimumLines=20
sonar.cpd.ts.minimumTokens=50
sonar.javascript.node.max-cognitive-complexity=15

# FC163 F1-MIG (Cond.R-163-F1-R2, 215_AN Alfa / 216_AN Bravo) — 40 issues PL/SQL
# (36 BLOCKER plsql:DeleteOrUpdateWithoutWhereCheck + 4 MAJOR plsql:NullComparison)
# en packages/database/migrations/** son DML deliberado ya aplicado en PROD
# (purgas controladas gateadas por GrayMan, backfills totales por CASE, resiembras
# limpiar-y-recargar, normalizaciones de catalogo completo) — verificado por
# lectura directa de 4 migraciones representativas, no solo por nombre de
# archivo (protocols/analysis/163_evidence/f0/triage_findings.md). Reescribir un
# .sql ya ejecutado en PROD para "arreglar" un rating de Sonar es un
# anti-patron de riesgo real (205_AN Alfa / 206_AN Bravo, politica heredada en
# firme). Exclusion quirurgica de estas 2 reglas SOLO para esta ruta -- a
# diferencia de sonar.exclusions arriba, el analisis del resto de
# migrations/** sigue activo para cualquier otra regla (una migracion futura
# con un error de sintaxis real, por ejemplo, se seguiria reportando).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=packages/database/migrations/**
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/database/migrations/**

