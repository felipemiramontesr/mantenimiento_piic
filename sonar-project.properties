# medida viven exclusivamente en packages/database/migrations/** (verificado
# archivo por archivo, 0 excepciones en las 11 reglas de abajo). Mismo
# razonamiento y misma política heredada en firme que e1/e2 arriba: reescribir
# SQL ya ejecutado en PROD para bajar un rating de Sonar es el anti-patrón de
# riesgo real ya rechazado (205_AN/206_AN) — 0 rewrite SQL. cpd.exclusions
