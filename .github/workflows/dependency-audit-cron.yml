name: 🛡️ Dependency Audit (daily)

# FC220 F2 — auditoría preventiva diaria de la cadena de suministro. Corre el mismo gate que el CI
# de producto (`scripts/dependencyAuditGate.ts`: critical = 0 ∧ high = 0) para detectar un aviso
# nuevo antes de que bloquee una entrega. Si falla, abre (o comenta) un Issue etiquetado
# `security`, que notifica a GrayMan por correo; Charlie lo transcribe al canal H.
# Procedimiento de atención y plazos: docs/security/dependency-triage.md

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: 🛡️ Security Audit (critical=0 ∧ high=0)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Security Audit (blocking — AuditPass · critical=0 ∧ high=0)
        run: bun scripts/dependencyAuditGate.ts
      - name: Open or update the security issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Aviso de seguridad en dependencias (auditoría diaria)"
          BODY="La auditoría diaria encontró avisos critical o high. Ejecución: ${RUN_URL}. Atender según docs/security/dependency-triage.md (crítica ≤ 24 h, alta ≤ 72 h, moderada/baja ≤ 7 días)."
          gh label create security --color B60205 --description "Avisos de seguridad" --force
          NUMBER=$(gh issue list --label security --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "${NUMBER}" ]; then
            gh issue comment "${NUMBER}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --label security --body "${BODY}"
          fi
